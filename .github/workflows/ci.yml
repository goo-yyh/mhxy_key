name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  quality-checks:
    name: Build and test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check
        working-directory: src-tauri

      - name: Test Rust
        run: cargo test
        working-directory: src-tauri
